name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: python -m pytest -ra

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen de pruebas y ejecutarlas dentro del contenedor
        run: |
          docker build --target test -t stockia-predict:test .
          docker run --rm stockia-predict:test

      - name: Construir imagen de ejecución
        run: docker build -t stockia-predict:latest .

      - name: Prueba de humo del contenedor (backtesting sin ML)
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD/out:/out" stockia-predict:latest \
            python scripts/05_backtesting_model_selection.py --skip-ml --output /out
          test -s out/model_metrics.csv
          grep -q tsb_selected out/model_metrics.csv
          echo "Resultados generados:" && ls -1 out
