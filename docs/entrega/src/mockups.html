<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>StockIA Predict — Mockups</title>
<style>
@page { size: 1440px 900px; margin: 0; }
:root{--navy:#14284b;--navy2:#1d3a66;--teal:#0e9f8e;--tealbg:#e6f6f3;--blue:#3b6fd4;--amber:#d98a0b;--amberbg:#fff3dc;--red:#c8453b;--redbg:#fde9e7;--green:#2f8f5b;--greenbg:#e5f4ec;--ink:#14284b;--mut:#66748b;--line:#e1e7f0;--bg:#f3f6fb;}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--ink)}
.page{width:1440px;height:900px;position:relative;overflow:hidden;background:var(--bg);page-break-after:always;break-after:page;display:flex}
.page:last-child{page-break-after:auto;break-after:auto}
.side{width:236px;background:var(--navy);color:#cfd9ea;padding:22px 16px;display:flex;flex-direction:column;flex:none}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:26px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--teal);color:#fff;font-weight:800;font-size:24px;display:grid;place-items:center}
.brand b{color:#fff;font-size:21px;display:block;line-height:1}
.brand span{font-size:10px;letter-spacing:.14em;color:#8fa3c4}
.nav a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;margin-bottom:4px;font-size:15px;color:#b9c7de}
.nav a.on{background:var(--navy2);color:#fff;font-weight:700}
.nav i{font-style:normal;width:18px;text-align:center;opacity:.8}
.ws{margin-top:auto;border-top:1px solid #2c4470;padding-top:14px;font-size:12px;color:#8fa3c4}
.ws b{display:block;color:#fff;font-size:14px;margin-top:4px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:13px;color:var(--mut);flex:none}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:#e9eef7;color:var(--navy);font-weight:700;display:grid;place-items:center;font-size:13px}
.content{flex:1;padding:22px 30px 18px;display:flex;flex-direction:column;gap:14px;min-height:0}
h1{margin:0;font-size:27px;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:14px;margin-top:4px}
.head{display:flex;justify-content:space-between;align-items:flex-start}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;background:var(--amberbg);color:var(--amber);padding:6px 10px;border-radius:7px;white-space:nowrap}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;gap:14px}
.kpi small{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--mut);text-transform:uppercase}
.kpi b{display:block;font-size:30px;margin:6px 0 2px}
.kpi em{font-style:normal;font-size:12.5px;font-weight:600}
.t-teal{color:var(--teal)}.t-blue{color:var(--blue)}.t-amber{color:var(--amber)}.t-red{color:var(--red)}.t-green{color:var(--green)}.t-mut{color:var(--mut)}
.badge{white-space:nowrap;display:inline-block;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px}
.b-teal{background:var(--tealbg);color:var(--teal)}.b-amber{background:var(--amberbg);color:var(--amber)}.b-red{background:var(--redbg);color:var(--red)}.b-green{background:var(--greenbg);color:var(--green)}.b-gray{background:#edf0f5;color:var(--mut)}.b-blue{background:#e5edfb;color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid #eef2f8}
tr.sel td{background:#f2f8fe}
.btn{display:inline-block;padding:10px 18px;border-radius:10px;font-weight:700;font-size:13.5px;border:1px solid var(--line);background:#fff;color:var(--navy)}
.btn.p{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.d{background:var(--navy);border-color:var(--navy);color:#fff}
.ia{align-self:start;border:2px dashed var(--teal);background:#f3fbf9;border-radius:12px;padding:12px 16px;font-size:12.5px;line-height:1.5}
.ia .ttl{font-weight:800;color:var(--teal);letter-spacing:.06em;font-size:11px;margin-bottom:4px;text-transform:uppercase}
.ia .io{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ia b{color:var(--navy)}
.note{align-self:start;background:var(--amberbg);border-radius:10px;padding:10px 14px;font-size:12.5px;color:#7a5200;line-height:1.45}
.warn{align-self:start;background:var(--redbg);border-radius:10px;padding:10px 14px;font-size:12.5px;color:#8a2f28;line-height:1.45}
.input{border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:14px;color:var(--mut);background:#fff;margin-bottom:12px}
.step{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;margin-right:8px}
svg text{font-family:"Segoe UI",system-ui,Arial,sans-serif}
.nw{white-space:nowrap}.pno{position:absolute;right:16px;bottom:8px;font-size:11px;color:#98a4b8}
</style>
</head>
<body>
<div id="root"></div>
<script>
const NAV=[["◈","Inicio"],["▣","Datos"],["⌁","Pronósticos"],["▤","Historial"],["⚑","Revisión"],["◔","Métricas"]];
function shell(n,activeIdx,title,sub,body,tag){
  const nav=NAV.map((x,i)=>`<a class="${i===activeIdx?'on':''}"><i>${x[0]}</i>${x[1]}</a>`).join("");
  return `<section class="page" id="p${n}">
  <aside class="side"><div class="brand"><div class="logo">S</div><div><b>StockIA</b><span>PREDICT</span></div></div>
  <nav class="nav">${nav}</nav>
  <div class="ws">ESPACIO DE TRABAJO<b>Retail UK · Demo UCI</b></div></aside>
  <div class="main"><div class="top"><span>StockIA Predict · ${title}</span><div class="user"><span>Pamela Salas · Analista de planificación</span><div class="avatar">PS</div></div></div>
  <div class="content"><div class="head"><div><h1>${title}</h1><div class="sub">${sub}</div></div>${tag?`<span class="tag">${tag}</span>`:""}</div>${body}</div></div>
  <div class="pno">Pantalla ${n} de 6</div></section>`;
}
const TAG="DATOS DE EJEMPLO · UCI ONLINE RETAIL II";

/* ---------- Gráfico de línea ---------- */
function lineChart(hist,fc,base,w,h,lastLabel){
  const all=hist.concat([fc,base]);const mx=Math.max(...all)*1.12;const L=40,R=96,T=14,B=30;
  const n=hist.length+1;const X=i=>L+i*(w-L-R)/(n-1);const Y=v=>T+(h-T-B)*(1-v/mx);
  let g="";for(let k=0;k<=4;k++){const v=mx*k/4;g+=`<line x1="${L}" x2="${w-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e8edf5"/><text x="${L-6}" y="${Y(v)+4}" font-size="10" fill="#8a97ac" text-anchor="end">${Math.round(v)}</text>`;}
  const pts=hist.map((v,i)=>`${X(i)},${Y(v)}`).join(" ");
  let dots=hist.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="#fff" stroke="#0e9f8e" stroke-width="2"/>`).join("");
  let lab="";for(let i=0;i<n;i++){lab+=`<text x="${X(i)}" y="${h-10}" font-size="10" fill="#8a97ac" text-anchor="middle">${i<n-1?'S-'+String(hist.length-i).padStart(2,'0'):'Próx.'}</text>`}
  const xl=X(n-1);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${g}
  <polyline points="${pts}" fill="none" stroke="#0e9f8e" stroke-width="2.5"/>
  <line x1="${X(hist.length-1)}" y1="${Y(hist[hist.length-1])}" x2="${xl}" y2="${Y(fc)}" stroke="#3b6fd4" stroke-width="2.5" stroke-dasharray="6 4"/>${dots}
  <circle cx="${xl}" cy="${Y(fc)}" r="6" fill="#3b6fd4"/><circle cx="${xl}" cy="${Y(base)}" r="5" fill="#fff" stroke="#8a97ac" stroke-width="2"/>
  <text x="${xl+12}" y="${Y(fc)-2}" font-size="11.5" font-weight="700" fill="#3b6fd4">TSB ${Math.round(fc)}</text>
  <text x="${xl+12}" y="${Y(base)+15}" font-size="10.5" fill="#66748b">Media 4 sem. ${Math.round(base)}</text>${lab}</svg>`;
}

/* ---------- Pantalla 1: Inicio / acceso ---------- */
const P1=`<section class="page" id="p1" style="background:linear-gradient(135deg,#14284b 0%,#1d3a66 55%,#0e7f74 100%);align-items:center;justify-content:center">
  <div style="display:flex;gap:46px;align-items:stretch">
   <div style="width:520px;color:#fff;padding-top:30px">
     <div class="brand"><div class="logo" style="width:56px;height:56px;font-size:30px">S</div><div><b style="font-size:30px">StockIA</b><span style="font-size:12px">PREDICT</span></div></div>
     <h2 style="font-size:34px;line-height:1.2;margin:10px 0 14px">Pronóstico semanal de ventas por producto y alertas de volumen inusual</h2>
     <p style="color:#c9d7ee;font-size:16px;line-height:1.55;margin:0 0 22px">Sube tu historial de ventas y obtén, para cada artículo, su patrón de demanda, un pronóstico para la semana siguiente y los pedidos que se salen de lo normal.</p>
     <div style="background:rgba(255,255,255,.1);border-radius:14px;padding:16px 18px;font-size:14px;line-height:1.6">
       <b>Qué hace</b> · Pronostica ventas observadas, clasifica la demanda, señala pedidos extraordinarios.<br>
       <b>Qué no hace</b> · No calcula stock ni genera órdenes de compra; la decisión es tuya.
     </div>
   </div>
   <div style="width:430px;background:#fff;border-radius:18px;padding:34px 34px 28px;color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.25)">
     <h3 style="margin:0 0 4px;font-size:22px">Ingresar</h3><div class="sub" style="margin-bottom:20px">Accede con tu cuenta de equipo</div>
     <div class="input">pamela.salas@ejemplo.cl</div><div class="input">••••••••••</div>
     <div class="btn p" style="display:block;text-align:center;margin:6px 0 14px">Entrar</div>
     <div style="text-align:center;color:var(--mut);font-size:12px;margin:10px 0">— o —</div>
     <div class="btn" style="display:block;text-align:center">Probar con datos de demostración (UCI Online Retail II)</div>
     <div style="margin-top:18px;font-size:11.5px;color:var(--mut);line-height:1.5">Dataset público de Chen, D. (2012), UCI Machine Learning Repository · CC BY 4.0. No se muestran identificadores de clientes.</div>
   </div>
  </div>
  <div class="ia" style="position:absolute;left:40px;bottom:26px;width:520px;background:rgba(255,255,255,.95)"><div class="ttl">IA en esta pantalla</div>La IA no interviene: solo identifica al usuario y el espacio de trabajo (entorno de demostración o datos propios).</div>
  <div class="pno" style="color:#9fb4d6">Pantalla 1 de 6</div></section>`;

/* ---------- Pantalla 2: Ingreso de datos ---------- */
const mapRows=[["Invoice","InvoiceNo","Agrupa líneas de factura"],["StockCode","StockCode","Identifica el producto"],["Description","Description","Nombre legible"],["Quantity","Quantity","Unidades vendidas"],["InvoiceDate","InvoiceDate","Construye la semana"],["Price","UnitPrice","Contexto"],["Customer ID","— (excluido)","No entra al modelo ni se muestra"],["Country","Country","Filtro: United Kingdom"]];
const P2=shell(2,1,"Ingreso de datos","Carga un archivo de ventas, asocia sus columnas y revisa su calidad antes de pronosticar.",`
 <div class="grid" style="grid-template-columns:1.1fr 1fr;flex:1;min-height:0">
  <div class="grid" style="grid-template-rows:auto 1fr;gap:14px;min-height:0">
   <div class="card" style="border:2px dashed #b9c7de;display:flex;align-items:center;gap:18px">
     <div style="font-size:34px">⬆</div><div style="flex:1"><b style="font-size:16px">online_retail_II.xlsx</b><div class="sub">45,6 MB · 2 hojas · cargado desde tu equipo</div></div><span class="badge b-green">Archivo leído</span>
   </div>
   <div class="card" style="min-height:0"><h3>Mapeo de columnas</h3>
    <table><tr><th>Columna del archivo</th><th>Campo de StockIA</th><th>Uso</th></tr>
    ${mapRows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="t-mut">${r[2]}</td></tr>`).join("")}</table></div>
  </div>
  <div class="grid" style="grid-template-rows:auto auto 1fr auto;gap:14px;min-height:0">
   <div class="card"><h3>Validación de calidad</h3>
    <div class="grid" style="grid-template-columns:1fr 1fr 1fr;gap:10px">
     <div class="kpi"><small>Filas leídas</small><b style="font-size:22px">1.067.371</b></div>
     <div class="kpi"><small>Duplicados exactos</small><b style="font-size:22px" class="t-amber">34.335</b><em class="t-mut">3,22 % · se eliminan</em></div>
     <div class="kpi"><small>Cancelaciones (C)</small><b style="font-size:22px" class="t-amber">19.104</b><em class="t-mut">no cuentan como venta</em></div>
     <div class="kpi"><small>Cantidades negativas</small><b style="font-size:22px" class="t-amber">22.496</b><em class="t-mut">devoluciones / ajustes</em></div>
     <div class="kpi"><small>Sin Customer ID</small><b style="font-size:22px">22,76 %</b><em class="t-mut">no se usa</em></div>
     <div class="kpi"><small>Semanas completas</small><b style="font-size:22px" class="t-green">104</b><em class="t-mut">2 sin ventas (= 0)</em></div>
    </div></div>
   <div class="note"><b>Antes de continuar:</b> el archivo no contiene stock, ventas perdidas ni órdenes de compra. StockIA pronosticará <b>ventas observadas</b>.</div>
   <div class="ia"><div class="ttl">IA · datos de entrada y salida</div><div class="io">
     <div><b>Entra:</b> ventas positivas del Reino Unido (línea de factura: producto, cantidad, fecha). Customer ID se excluye.</div>
     <div><b>Sale:</b> serie semanal de unidades por artículo (4.775 artículos activos × 104 semanas) lista para segmentar y pronosticar.</div></div></div>
   <div style="display:flex;gap:10px;justify-content:flex-end"><span class="btn">Cancelar</span><span class="btn p">Ejecutar análisis →</span></div>
  </div>
 </div>`,TAG);

/* ---------- Pantalla 3: Resultado de la IA ---------- */
const prods=[["85123A","WHITE HANGING HEART T-LIGHT HOLDER","Erratic","Media","b-amber",true],["84077","WORLD WAR 2 GLIDERS ASSTD DESIGNS","Erratic","Media","b-amber",false],["16014","SMALL CHINESE STYLE SCISSOR","Lumpy","Baja","b-red",false]];
const P3=shell(3,2,"Resultado de la IA · Pronóstico por producto","Estimación de unidades vendidas para la semana siguiente, con su explicación y su fiabilidad histórica.",`
 <div class="grid" style="grid-template-columns:330px 1fr;flex:1;min-height:0">
  <div style="display:flex;flex-direction:column;gap:14px;min-height:0"><div class="card" style="padding:14px"><h3>Productos</h3>
   ${prods.map(p=>`<div style="padding:11px 10px;border-radius:10px;margin-bottom:6px;${p[5]?'background:#eef7f5;border:1px solid #bfe6df':'border:1px solid #edf1f7'}"><div style="font-size:12.5px;font-weight:700">${p[1]}</div><div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px"><span class="t-mut">${p[0]} · ${p[2]}</span><span class="badge ${p[4]}">Fiabilidad ${p[3]}</span></div></div>`).join("")}
   <div class="sub" style="font-size:11.5px;margin-top:8px">Fiabilidad = error histórico del método en el segmento del producto (backtesting).</div>
  </div>
  <div class="card" style="padding:14px;border:2px solid #bfd0ee">
   <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h3 style="margin:0">Cobertura de stock</h3><span class="badge b-blue" style="font-size:10.5px">OPCIONAL</span></div>
   <div class="sub" style="font-size:11.5px;margin:0 0 8px">Datos que ingresa el usuario (valores de ejemplo)</div>
   <div class="grid" style="grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px">
    <div><div style="font-size:10px;color:var(--mut);font-weight:700">STOCK ACTUAL</div><div class="input" style="margin:3px 0 0;padding:7px 9px;font-size:13px;color:var(--navy)">1.200</div></div>
    <div><div style="font-size:10px;color:var(--mut);font-weight:700">PLAZO (SEM.)</div><div class="input" style="margin:3px 0 0;padding:7px 9px;font-size:13px;color:var(--navy)">2</div></div>
    <div><div style="font-size:10px;color:var(--mut);font-weight:700">SEGURIDAD (SEM.)</div><div class="input" style="margin:3px 0 0;padding:7px 9px;font-size:13px;color:var(--navy)">1</div></div>
   </div>
   <div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--line)"><span>Cobertura con el stock actual</span><b class="t-red">1,7 sem.</b></div>
   <div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--line)"><span>Cantidad referencial a pedir</span><b class="t-blue">971 uds</b></div>
   <div class="note" style="font-size:11px;padding:7px 10px;margin-top:4px">724 × (2 + 1) − 1.200. Supone demanda constante igual al pronóstico. <b>Cálculo informativo, no validado.</b></div>
  </div>
  </div>
  <div class="grid" style="grid-template-rows:auto 1fr auto;gap:14px;min-height:0">
   <div class="grid" style="grid-template-columns:1.4fr 1fr 1fr 1fr;gap:14px">
    <div class="card"><small style="font-size:11px;color:var(--mut);font-weight:700">PRODUCTO SELECCIONADO</small><div style="font-size:17px;font-weight:800;margin-top:8px;line-height:1.25">WHITE HANGING HEART T-LIGHT HOLDER</div><div class="sub">Código 85123A · semana del 05-12-2011</div></div>
    <div class="card kpi"><small>Pronóstico TSB</small><b class="t-teal">724 uds</b><em class="t-teal">Método seleccionado (α = 0,30)</em></div>
    <div class="card kpi"><small>Referencia · media 4 sem.</small><b class="t-blue">727 uds</b><em class="t-blue">Baseline sin IA</em></div>
    <div class="card kpi"><small>Patrón de demanda</small><b style="font-size:24px">Erratic</b><em class="t-mut">ADI 1,02 · ventas casi todas las semanas, cantidades muy variables</em></div>
   </div>
   <div class="grid" style="grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;min-height:0">
    <div class="card"><h3>Unidades vendidas por semana (últimas 12) y pronóstico</h3><div id="chart3"></div></div>
    <div class="grid" style="grid-template-rows:auto 1fr;gap:14px">
     <div class="card"><h3>Cómo se calculó</h3><div style="font-size:12.5px;line-height:1.55">TSB combina la <b>probabilidad</b> de que haya venta esa semana con el <b>tamaño esperado</b> de una venta, y se actualiza cada semana con el historial. El parámetro α se eligió con las 8 semanas más recientes.</div></div>
     <div class="warn"><b>Fiabilidad media.</b> En el backtesting, el error de TSB en productos erratic fue 76,0 % (WAPE). Úsalo como referencia, no como certeza.<br><b>Si fuera baja</b> (producto lumpy como 16014, WAPE 95,5 %, o con menos de 20 semanas de historia) se muestra el aviso <i>«Revisión manual recomendada»</i> y el baseline junto al pronóstico.</div>
    </div>
   </div>
   <div class="ia"><div class="ttl">IA · datos de entrada y salida</div><div class="io">
     <div><b>Entra:</b> historial semanal del producto (104 semanas), segmento ADI/CV² y α elegido en validación interna.</div>
     <div><b>Sale:</b> pronóstico puntual para 1 semana, baseline, segmento y fiabilidad histórica; sin intervalo de confianza. La cobertura de stock es aritmética sobre el pronóstico con datos del usuario (no es IA).</div></div></div>
  </div>
 </div>`,TAG);

/* ---------- Pantalla 4: Historial ---------- */
const runs=[[3,"22-11-2026 17:10","online_retail_II.xlsx","28-11-2011","2.201","TSB · α 0,30","Completada","b-green"],[2,"20-11-2026 11:42","online_retail_II.xlsx","31-10-2011","2.201","TSB · α 0,20","Completada","b-green"],[1,"18-11-2026 09:05","online_retail_II.xlsx","26-09-2011","2.201","TSB · α 0,30","Completada","b-green"]];
const saved=[["85123A","WHITE HANGING HEART T-LIGHT HOLDER","Erratic","724","727","Media","Aceptado","b-green"],["84077","WORLD WAR 2 GLIDERS ASSTD DESIGNS","Erratic","1.057","877","Media","Pendiente","b-gray"],["16014","SMALL CHINESE STYLE SCISSOR","Lumpy","376","134","Baja","Ajustado","b-blue"],["84826","ASSTD DESIGN 3D PAPER STICKERS","Lumpy","1.506","3.138","Baja","Pendiente","b-gray"]];
const P4=shell(4,3,"Historial de ejecuciones","Cada análisis queda registrado con su archivo, corte temporal, método y parámetros para poder reproducirlo.",`
